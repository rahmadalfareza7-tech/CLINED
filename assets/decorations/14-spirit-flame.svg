<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>

    <linearGradient id="sfBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0ffff"/>
      <stop offset="40%" stop-color="#22d3ff"/>
      <stop offset="100%" stop-color="#1348b8"/>
    </linearGradient>
    <filter id="sfGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

    <!-- Aggressive Whipping Blue Foxfire Crown -->
    <g filter="url(#sfGlow)">
      <path d="M 86 122 C 138 66, 224 44, 314 62 C 378 74, 430 116, 434 176 C 436 218, 404 244, 368 232 C 396 212, 406 172, 382 138 C 344 88, 266 78, 198 96 L 146 82 L 166 106 C 132 116, 108 128, 86 122 Z"
            fill="url(#sfBlue)"/>
      <!-- Sharp licking flame tips -->
      <path d="M 122 92 L 96 68 L 154 78 L 194 48 L 222 72 L 284 52 L 306 74"
            fill="url(#sfBlue)"/>
      <path d="M 134 96 C 194 68, 272 64, 336 88 C 276 82, 206 88, 134 96 Z" fill="#ffffff"/>
    </g>
    <!-- Fierce Horned Oni Spirit Orb (Top-Right) -->
    <g transform="translate(372,148)">
      <!-- Sharp curved demon horns -->
      <path d="M -22 -22 C -34 -46, -24 -66, -6 -58 C -16 -46, -12 -34, -4 -28 Z" fill="#14151e" stroke="#22d3ff" stroke-width="4" stroke-linejoin="round"/>
      <path d="M 22 -22 C 34 -46, 24 -66, 6 -58 C 16 -46, 12 -34, 4 -28 Z" fill="#14151e" stroke="#22d3ff" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="0" cy="0" r="36" fill="#11121a" stroke="#22d3ff" stroke-width="5"/>
      <!-- Fierce Slanted Crimson Eye -->
      <path d="M -22 -4 L 22 -4 C 18 16, -18 16, -22 -4 Z" fill="#ff1e42"/>
      <polygon points="0,-6 5,10 0,14 -5,10" fill="#0b0c12"/>
      <circle cx="-6" cy="2" r="2.8" fill="#ffffff"/>
    </g>
    <!-- Heavy Tactical Harness & Armored Clasp at Bottom -->
    <g stroke="#0e1017" stroke-linejoin="round">
      <path d="M 88 338 C 138 416, 204 452, 256 452 C 308 452, 374 416, 424 338" fill="none" stroke="#0e1017" stroke-width="24" stroke-linecap="round"/>
      <path d="M 88 338 C 138 416, 204 452, 256 452 C 308 452, 374 416, 424 338" fill="none" stroke="#2e3342" stroke-width="12" stroke-linecap="round"/>
      <!-- Armored Gauntlet / Blade Clasp -->
      <polygon points="256,416 296,446 256,476 216,446" fill="#5e6678" stroke="#0e1017" stroke-width="6"/>
      <polygon points="256,426 280,446 256,466 232,446" fill="#1c202b"/>
      <polygon points="256,434 268,446 256,458 244,446" fill="#22d3ff" filter="url(#sfGlow)"/>
      <!-- Metal Dog-Tag / Seal Bottom-Left -->
      <g transform="translate(102,386) rotate(14)">
        <polygon points="-20,-18 20,-18 20,24 0,34 -20,24" fill="#cfd6e2" stroke="#0e1017" stroke-width="6"/>
        <line x1="-10" y1="-4" x2="10" y2="-4" stroke="#1e222e" stroke-width="4"/>
        <line x1="-10" y1="6" x2="10" y2="6" stroke="#1e222e" stroke-width="4"/>
        <line x1="-10" y1="16" x2="4" y2="16" stroke="#ff1e42" stroke-width="4"/>
      </g>
    </g>
    
</svg>
