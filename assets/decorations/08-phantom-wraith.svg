<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>

    <linearGradient id="pwPale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f5f8"/>
      <stop offset="70%" stop-color="#c4c8d2"/>
      <stop offset="100%" stop-color="#606573"/>
    </linearGradient>
    <filter id="pwSh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    
  </defs>

    <g filter="url(#pwSh)" stroke-linejoin="round" stroke-linecap="round">

      <!-- Bottom-Left Sweeping Shadow Claw Tail -->
      <path d="M 94 348 C 110 404, 152 448, 212 468 C 186 444, 154 416, 128 384 C 114 366, 104 354, 94 348 Z"
            fill="#0a0b0e" stroke="#cfd4de" stroke-width="2"/>
