      <path d="M 386 352 C 414 334, 434 306, 444 274 C 446 318, 422 364, 384 392 L 352 396 L 372 376 L 334 374 L 368 358 Z"
            fill="#090a0d" stroke="#d4d8e2" stroke-width="2.2"/>

      <!-- === TOP-LEFT: DARK-INKED SKELETAL CLAWED HAND (BLACK BASE + STARK WHITE BONE HIGHLIGHTS) === -->
      <!-- Bony wrist & metacarpals arch (dark silhouette) -->
      <path d="M 70 288 C 60 226, 74 162, 114 114 C 154 66, 206 48, 248 60 C 260 66, 260 88, 246 98 C 236 122, 224 148, 218 168 C 212 142, 214 114, 214 96 C 198 112, 184 146, 174 192 C 166 158, 172 124, 178 102 C 156 122, 138 160, 126 218 C 120 182, 128 144, 136 120 C 114 148, 100 192, 96 254 C 90 286, 94 316, 104 346 C 84 330, 74 310, 70 288 Z"
