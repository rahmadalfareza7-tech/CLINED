<svg class="deco-03" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  
  <style class="deco-anim">@keyframes d03_earL { 0%,72%,100% { transform: rotate(0deg); } 80% { transform: rotate(-8deg); } 88% { transform: rotate(0deg); } }
      @keyframes d03_earR { 0%,76%,100% { transform: rotate(0deg); } 84% { transform: rotate(8deg); } 92% { transform: rotate(0deg); } }
      @keyframes d03_wag { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-5.5deg) translateY(-3px); } }
      @keyframes d03_snow { 0%,100% { transform: scale(0.6) rotate(0deg); opacity: 0.45; } 50% { transform: scale(1.38) rotate(35deg); opacity: 1; } }
      .deco-03 path[d^="M 90 182"], .deco-03 path[d^="M 108 156"], .deco-03 path[d^="M 98 146"] { transform-box: fill-box; transform-origin: 70% 90%; animation: d03_earL 3.2s ease-in-out infinite; }
      .deco-03 path[d^="M 422 182"], .deco-03 path[d^="M 404 156"], .deco-03 path[d^="M 414 146"] { transform-box: fill-box; transform-origin: 30% 90%; animation: d03_earR 3.6s ease-in-out infinite; }
      .deco-03 path[fill*="slTail"] { transform-box: fill-box; transform-origin: 18% 40%; animation: d03_wag 2.2s ease-in-out infinite; }
      .deco-03 g[filter*="slGlow"] polygon, .deco-03 g[filter*="slGlow"] circle { transform-box: fill-box; transform-origin: center; animation: d03_snow 2.0s ease-in-out infinite; }</style>
  <defs>

    <linearGradient id="slFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#dce3f0"/>
      <stop offset="100%" stop-color="#8b96ab"/>
    </linearGradient>
    <linearGradient id="slTail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2f6fc"/>
      <stop offset="55%" stop-color="#b6c2d6"/>
      <stop offset="88%" stop-color="#5a6578"/>
      <stop offset="100%" stop-color="#282d38"/>
    </linearGradient>
    <filter id="slSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0d1424" flood-opacity="0.45"/>
    </filter>
    <filter id="slGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

    <!-- Subtle Icy Frosted Rim Aura -->
    <circle cx="256" cy="256" r="188" fill="none" stroke="#cce8ff" stroke-width="5" opacity="0.62" filter="url(#slGlow)"/>

    <g filter="url(#slSh)">
      <!-- Left Fluffy Leopard Ear -->
      <path d="M 90 182 C 62 134, 72 78, 112 64 C 152 50, 196 78, 214 112 C 172 122, 126 146, 90 182 Z"
            fill="url(#slFur)" stroke="#1b202b" stroke-width="8" stroke-linejoin="round"/>
      <path d="M 108 156 C 96 124, 104 94, 126 86 C 148 78, 176 96, 190 116 C 160 124, 132 138, 108 156 Z"
            fill="#c2cde0"/>
      <!-- Soft rosy-frost inner shadow -->
      <path d="M 118 144 C 110 122, 116 102, 132 98 C 148 94, 166 104, 174 116 Z" fill="#9eaac0" opacity="0.7"/>
      <!-- Thick Snowy Fur Tufts -->
      <path d="M 98 146 C 116 136, 128 134, 138 132 L 118 122 L 146 116"
            fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Leopard Spots -->
      <ellipse cx="104" cy="84" rx="8" ry="6" fill="#2d3442" transform="rotate(-25 104 84)"/>
      <circle cx="144" cy="70" r="6" fill="#2d3442"/>
      <circle cx="84" cy="116" r="5" fill="#2d3442"/>

      <!-- Right Fluffy Leopard Ear -->
      <path d="M 422 182 C 450 134, 440 78, 400 64 C 360 50, 316 78, 298 112 C 340 122, 386 146, 422 182 Z"
            fill="url(#slFur)" stroke="#1b202b" stroke-width="8" stroke-linejoin="round"/>
      <path d="M 404 156 C 416 124, 408 94, 386 86 C 364 78, 336 96, 322 116 C 352 124, 380 138, 404 156 Z"
            fill="#c2cde0"/>
      <path d="M 394 144 C 402 122, 396 102, 380 98 C 364 94, 346 104, 338 116 Z" fill="#9eaac0" opacity="0.7"/>
      <path d="M 414 146 C 396 136, 384 134, 374 132 L 394 122 L 366 116"
            fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="408" cy="84" rx="8" ry="6" fill="#2d3442" transform="rotate(25 408 84)"/>
      <circle cx="368" cy="70" r="6" fill="#2d3442"/>
      <circle cx="428" cy="116" r="5" fill="#2d3442"/>

      <!-- Lush Extra-Fluffy Curled Snow Leopard Tail -->
      <path d="M 134 392 C 98 424, 128 478, 202 468 C 272 458, 322 426, 376 446 C 412 458, 430 434, 412 408 C 390 378, 328 390, 266 414 C 214 434, 174 438, 158 420 C 150 412, 154 398, 134 392 Z"
            fill="url(#slTail)" stroke="#1b202b" stroke-width="8" stroke-linejoin="round"/>
      <!-- Glossy top-fur rim highlight along tail -->
      <path d="M 152 444 C 204 456, 262 436, 322 424" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
      <!-- Leopard Rosettes -->
      <g fill="none" stroke="#2d3442" stroke-width="5.5">
        <circle cx="172" cy="446" r="8"/>
        <circle cx="218" cy="446" r="9"/>
        <circle cx="264" cy="432" r="9"/>
        <circle cx="310" cy="420" r="8"/>
      </g>
      <circle cx="194" cy="436" r="4.5" fill="#2d3442"/>
      <circle cx="242" cy="448" r="5" fill="#2d3442"/>
      <circle cx="288" cy="438" r="5" fill="#2d3442"/>
      <path d="M 358 412 C 384 404, 404 416, 406 432 C 394 446, 368 442, 354 432 Z" fill="#242936"/>
    </g>

    <!-- Icy Winter Snow Sparkles -->
    <g filter="url(#slGlow)">
      <polygon points="85.0,232.0 74.3,234.3 72.0,245.0 69.7,234.3 59.0,232.0 69.7,229.7 72.0,219.0 74.3,229.7" fill="#e6f6ff" opacity="0.95" />
      <polygon points="453.0,248.0 444.0,250.0 442.0,259.0 440.0,250.0 431.0,248.0 440.0,246.0 442.0,237.0 444.0,246.0" fill="#ffffff" opacity="0.92" />
      <polygon points="439.0,376.0 428.3,378.3 426.0,389.0 423.7,378.3 413.0,376.0 423.7,373.7 426.0,363.0 428.3,373.7" fill="#cceeff" opacity="0.95" />
      <circle cx="88" cy="342" r="4" fill="#ffffff" opacity="0.85"/>
      <circle cx="436" cy="176" r="3.5" fill="#d6f0ff" opacity="0.85"/>
    </g>
    
</svg>
