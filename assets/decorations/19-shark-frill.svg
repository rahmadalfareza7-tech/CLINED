<svg class="deco-19" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <style class="deco-anim">@keyframes d19_tail { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-6deg) translateY(-3px); } }
      @keyframes d19_fin { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
      @keyframes d19_splash { 0%,100% { opacity: 0.65; transform: scale(0.97); } 50% { opacity: 1; transform: scale(1.04); } }
      .deco-19 .sh-tail { transform-box: fill-box; transform-origin: 20% 70%; animation: d19_tail 2.0s ease-in-out infinite; }
      .deco-19 .sh-head { animation: d19_fin 2.4s ease-in-out infinite; }
      .deco-19 .sh-water { transform-origin: 256px 256px; animation: d19_splash 2.2s ease-in-out infinite; }</style>
  <defs>
    <linearGradient id="shSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5d728a"/>
      <stop offset="48%" stop-color="#354456"/>
      <stop offset="100%" stop-color="#18212b"/>
    </linearGradient>
    <linearGradient id="shBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f6fa"/>
      <stop offset="100%" stop-color="#b4c2d4"/>
    </linearGradient>
    <linearGradient id="shWater" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d6f8ff"/>
      <stop offset="50%" stop-color="#38c8ff"/>
      <stop offset="100%" stop-color="#145ca8"/>
    </linearGradient>
    <filter id="shDrop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="shGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Swirling Dynamic Ocean Water Slash Wrapping Around Rim -->
  <g class="sh-water" filter="url(#shGlow)">
    <path d="M 78 236 C 60 326, 118 424, 218 450 C 314 474, 412 424, 444 334 C 414 398, 326 446, 232 428 C 138 410, 86 332, 78 236 Z"
          fill="url(#shWater)" opacity="0.88"/>
    <path d="M 102 356 C 146 420, 236 454, 324 434 C 244 436, 166 408, 102 356 Z" fill="#e8fcff" opacity="0.9"/>
    <circle cx="72" cy="316" r="5" fill="#d6f8ff"/>
    <circle cx="446" cy="276" r="4.5" fill="#9ef0ff"/>
  </g>

  <g filter="url(#shDrop)" stroke="#0d131a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">

    <!-- === TOP: FIERCE APEX SHARK DORSAL FIN & PREDATORY SHARK HEAD/JAWS === -->
    <g class="sh-head">
      <!-- Iconic Swept-Back Shark Dorsal Fin Rising Above Top-Left -->
      <path d="M 122 126 C 118 76, 138 30, 178 16 C 166 48, 172 78, 198 92 Z"
            fill="url(#shSkin)"/>
      <path d="M 142 98 C 142 66, 154 42, 170 28" fill="none" stroke="#8aa2bd" stroke-width="3.5" opacity="0.7"/>

      <!-- Sleek Predatory Shark Snout & Upper Head Arching Over Top Rim -->
      <path d="M 80 218
               C 76 154, 116 94, 186 72
               C 256 50, 344 58, 408 106
               C 430 122, 444 140, 448 158
               C 412 140, 368 122, 314 114
               C 246 104, 178 118, 130 158
               C 106 178, 92 198, 80 218 Z"
            fill="url(#shSkin)"/>

      <!-- Lighter Silver-White Shark Jaw Under-Rim & Snout Highlight -->
      <path d="M 186 76 C 248 58, 326 64, 386 100" fill="none" stroke="#8da6c2" stroke-width="4" opacity="0.75"/>

      <!-- 3 Sharp Shark Gill Slits on Left Side -->
      <path d="M 126 142 Q 134 128, 146 122 M 142 134 Q 150 120, 162 114 M 158 128 Q 166 114, 178 108"
            fill="none" stroke="#0d131a" stroke-width="4.5"/>

      <!-- Fierce Slanted Glowing Shark Eye (Top-Right of Snout) -->
      <path d="M 332 94 L 368 104 L 344 112 Z" fill="#0b0f14" stroke="#0b0f14" stroke-width="2"/>
      <polygon points="342,99 358,104 346,108" fill="#ff2e4c" stroke="none"/>
      <circle cx="347" cy="102" r="2.2" fill="#ffffff" stroke="none"/>

      <!-- Dark Crimson Inner Mouth Line + Rows of Razor-Sharp White Triangular Shark Teeth! -->
      <path d="M 164 134 C 228 102, 336 106, 424 148 C 392 146, 354 132, 314 126 C 254 116, 200 124, 164 134 Z"
            fill="#8c1124" stroke="#0d131a" stroke-width="4"/>
      <!-- Razor White Triangular Shark Teeth -->
      <path d="M 188 126 L 200 152 L 214 120 L 228 150 L 244 118 L 260 150 L 278 118 L 294 152 L 314 122 L 330 156 L 350 128 L 366 160 L 386 136 L 400 162 L 414 144 Z"
            fill="#ffffff" stroke="#0d131a" stroke-width="4" stroke-linejoin="miter"/>
    </g>

    <!-- === BOTTOM-RIGHT: MUSCULAR SWEEPING SHARK TAIL FIN === -->
    <g class="sh-tail">
      <path d="M 278 446
               C 334 446, 384 418, 416 376
               C 438 346, 456 320, 486 306
               C 472 346, 464 380, 474 416
               C 444 402, 420 404, 398 424
               C 366 452, 322 466, 278 446 Z"
            fill="url(#shSkin)"/>
      <!-- Lighter Shark Tail Belly Edge -->
      <path d="M 294 452 C 338 456, 378 440, 408 412 C 424 398, 444 396, 464 406 C 438 408, 412 426, 384 444 C 354 460, 322 464, 294 452 Z"
            fill="url(#shBelly)" stroke-width="4"/>
    </g>
  </g>
</svg>
