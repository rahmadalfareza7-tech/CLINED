      <circle cx="196" cy="424" r="3.5" fill="#ff2442" stroke="#12131a" stroke-width="1.5"/>
      <circle cx="316" cy="424" r="3.5" fill="#ff2442" stroke="#12131a" stroke-width="1.5"/>
