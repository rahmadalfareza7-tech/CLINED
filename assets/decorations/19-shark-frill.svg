<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>

    <linearGradient id="sfSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dce2ec"/>
      <stop offset="40%" stop-color="#8791a3"/>
      <stop offset="100%" stop-color="#363c48"/>
    </linearGradient>
    <filter id="sfSh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    
  </defs>

    <g filter="url(#sfSh)">
      <!-- Ruffled White Headband Top -->
      <path d="M 72 204 C 70 142, 100 98, 128 88 C 136 68, 168 58, 192 66 C 210 48, 244 44, 256 50 C 268 44, 302 48, 320 66 C 344 58, 376 68, 384 88 C 412 98, 442 142, 440 204 C 420 164, 390 122, 344 100 C 292 74, 220 74, 168 100 C 122 122, 92 164, 72 204 Z"
