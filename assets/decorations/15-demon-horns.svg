<svg class="deco-15" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  
  <style class="deco-anim">@keyframes d15_tail { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-6deg) translateY(-4px); } }
      @keyframes d15_magma { 0%,100% { opacity: 0.65; filter: brightness(0.95); } 50% { opacity: 1; filter: brightness(1.35); } }
      @keyframes d15_emb { 0%,100% { transform: translateY(0px); opacity: 0.5; } 50% { transform: translateY(-14px); opacity: 1; } }
      .deco-15 .dh-tail { transform-box: fill-box; transform-origin: 18% 45%; animation: d15_tail 2.0s ease-in-out infinite; }
      .deco-15 .dh-magma { animation: d15_magma 1.6s ease-in-out infinite; }
      .deco-15 .dh-embers { animation: d15_emb 2.2s ease-in-out infinite; }</style>
  <defs>

    <linearGradient id="dhHorn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1620"/>
      <stop offset="48%" stop-color="#1c0a10"/>
      <stop offset="100%" stop-color="#080305"/>
    </linearGradient>
    <linearGradient id="dhMagma" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0a6"/>
      <stop offset="45%" stop-color="#ff2e44"/>
      <stop offset="100%" stop-color="#9e081a"/>
    </linearGradient>
    <filter id="dhGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dhSh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    
  </defs>

    <!-- Subtle Crimson Molten Aura Ring -->
    <circle cx="256" cy="256" r="189" fill="none" stroke="url(#dhMagma)" stroke-width="5" opacity="0.72" filter="url(#dhGlow)"/>

    <g filter="url(#dhSh)" stroke="#080204" stroke-linejoin="round" stroke-linecap="round">
      <!-- === LEFT CURVED OBSIDIAN DEMON HORN === -->
      <g class="dh-horn-l">
        <path d="M 118 168 C 72 138, 46 82, 74 28 C 82 58, 102 76, 134 92 C 160 104, 178 114, 186 124 C 158 134, 136 148, 118 168 Z"
              fill="url(#dhHorn)" stroke-width="7"/>
        <!-- Sculpted Ridge Rings -->
        <path d="M 88 128 Q 108 114, 126 116 M 74 102 Q 92 92, 108 94 M 68 74 Q 82 68, 92 70" fill="none" stroke="#4d1d29" stroke-width="4.5"/>
        <!-- Glowing Molten Magma Fracture Vein inside Left Horn -->
        <path class="dh-magma" d="M 76 48 C 76 82, 96 114, 136 136" fill="none" stroke="url(#dhMagma)" stroke-width="5" filter="url(#dhGlow)"/>
      </g>

      <!-- === RIGHT CURVED OBSIDIAN DEMON HORN === -->
      <g class="dh-horn-r">
        <path d="M 394 168 C 440 138, 466 82, 438 28 C 430 58, 410 76, 378 92 C 352 104, 334 114, 326 124 C 354 134, 376 148, 394 168 Z"
              fill="url(#dhHorn)" stroke-width="7"/>
        <path d="M 424 128 Q 404 114, 386 116 M 438 102 Q 420 92, 404 94 M 444 74 Q 430 68, 420 70" fill="none" stroke="#4d1d29" stroke-width="4.5"/>
        <path class="dh-magma" d="M 436 48 C 436 82, 416 114, 376 136" fill="none" stroke="url(#dhMagma)" stroke-width="5" filter="url(#dhGlow)"/>
      </g>

      <!-- === BARBED CRIMSON-BLACK DEVIL TAIL CURVING AROUND BOTTOM === -->
      <g class="dh-tail">
        <path d="M 130 398 C 166 456, 266 474, 354 426 C 384 410, 408 386, 424 358"
              fill="none" stroke="#080204" stroke-width="20" stroke-linecap="round"/>
        <path d="M 130 398 C 166 456, 266 474, 354 426 C 384 410, 408 386, 424 358"
              fill="none" stroke="#8c0d1f" stroke-width="11" stroke-linecap="round"/>
        <path d="M 152 414 C 194 454, 276 462, 348 424" fill="none" stroke="#ff384e" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
        <!-- Razor Barbed Spade Arrowhead Tip -->
        <path d="M 412 368 L 402 326 L 448 318 L 440 364 L 460 374 L 424 380 Z"
              fill="url(#dhMagma)" stroke="#080204" stroke-width="6"/>
      </g>
    </g>

    <!-- Rising Molten Embers -->
    <g class="dh-embers" filter="url(#dhGlow)">
      <circle cx="84" cy="212" r="4.5" fill="#ff4d5a"/>
      <circle cx="436" cy="224" r="4" fill="#ffd266"/>
      <circle cx="114" cy="364" r="4" fill="#ff334b"/>
      <circle cx="388" cy="434" r="4.5" fill="#ff9933"/>
    </g>
    
</svg>
