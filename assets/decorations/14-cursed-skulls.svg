<svg class="deco-14" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  
  <style class="deco-anim">@keyframes d14_flame { 0%,100% { transform: scale(0.98) translateY(3px); opacity: 0.82; } 50% { transform: scale(1.05) translateY(-7px); opacity: 1; } }
      @keyframes d14_wisp { 0%,100% { transform: translateY(0px); opacity: 0.55; } 50% { transform: translateY(-14px); opacity: 1; } }
      .deco-14 .cs-flames { transform-origin: 256px 256px; animation: d14_flame 1.6s ease-in-out infinite; }
      .deco-14 .cs-wisps { animation: d14_wisp 2.2s ease-in-out infinite; }</style>
  <defs>

    <linearGradient id="csBone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8bac9"/>
      <stop offset="50%" stop-color="#60707e"/>
      <stop offset="100%" stop-color="#1e252c"/>
    </linearGradient>
    <linearGradient id="csFire" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0%" stop-color="#1184a6"/>
      <stop offset="48%" stop-color="#48e8ff"/>
      <stop offset="100%" stop-color="#ebffff"/>
    </linearGradient>
    <filter id="csWarp" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.045" numOctaves="3" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="11" xChannelSelector="R" yChannelSelector="G" result="w"/>
      <feGaussianBlur in="w" stdDeviation="4" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="w"/></feMerge>
    </filter>
    <filter id="csGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

    <!-- Swirling Cyan Soul-Flame Ring Framing the Avatar -->
    <g class="cs-flames" filter="url(#csWarp)">
      <path d="M 96 154 C 48 228, 56 346, 134 416 C 212 486, 342 478, 412 396 C 464 334, 466 232, 422 152 C 424 218, 416 304, 362 366 C 304 432, 198 434, 136 372 C 84 320, 78 232, 96 154 Z"
            fill="url(#csFire)" opacity="0.88"/>
      <!-- Roaring Top-Left & Top-Right Soul Flame Plumes -->
      <path d="M 88 222 C 46 162, 66 86, 132 54 C 118 92, 122 128, 138 158 C 110 176, 98 198, 88 222 Z" fill="url(#csFire)"/>
      <path d="M 424 222 C 466 162, 446 86, 380 54 C 394 92, 390 128, 374 158 C 402 176, 414 198, 424 222 Z" fill="url(#csFire)"/>
    </g>

    <!-- Clustered Gothic Comic-Inked Skulls Around Bottom & Sides -->
    <g class="cs-skulls">
      
        <g transform="translate(102,346) rotate(-24) scale(0.96,0.96)" stroke="#07090b" stroke-width="2.8" stroke-linejoin="miter">
          <path d="M -26 -14 C -24 -38, -6 -46, 12 -42 C 28 -38, 34 -22, 30 -2 L 34 8 L 24 18 L 20 34 L 12 36 L 8 28 L 2 36 L -4 34 L -8 26 L -14 34 L -20 26 L -20 14 L -30 4 Z"
                fill="url(#csBone)"/>
          <path d="M 10 -42 C 28 -38, 34 -22, 30 -2 L 34 8 L 24 18 L 20 34 L 4 34 L 6 16 L 18 10 L 20 -8 L 8 -18 L 16 -28 Z"
                fill="#090c10" stroke="none"/>
          <path d="M -6 -41 L -2 -28 L -10 -20 L -6 -12" fill="none" stroke="#07090b" stroke-width="2"/>
          <path d="M -22 -8 L -6 -10 L -4 2 L -16 6 Z" fill="#06080a"/>
          <path d="M 4 -10 L 24 -8 L 20 6 L 6 4 Z" fill="#06080a"/>
          <path d="M 6 -4 L 18 -10 L 14 2 Z" fill="#80f8ff" filter="url(#csGlow)"/><path d="M -16 -2 L -8 -6 L -10 2 Z" fill="#4ce8ff"/>
          <path d="M 0 6 L -5 18 L 0 15 L 5 18 Z" fill="#06080a"/>
        </g>
        
      
        <g transform="translate(410,346) rotate(24) scale(-0.96,0.96)" stroke="#07090b" stroke-width="2.8" stroke-linejoin="miter">
          <path d="M -26 -14 C -24 -38, -6 -46, 12 -42 C 28 -38, 34 -22, 30 -2 L 34 8 L 24 18 L 20 34 L 12 36 L 8 28 L 2 36 L -4 34 L -8 26 L -14 34 L -20 26 L -20 14 L -30 4 Z"
                fill="url(#csBone)"/>
          <path d="M 10 -42 C 28 -38, 34 -22, 30 -2 L 34 8 L 24 18 L 20 34 L 4 34 L 6 16 L 18 10 L 20 -8 L 8 -18 L 16 -28 Z"
                fill="#090c10" stroke="none"/>
          <path d="M -6 -41 L -2 -28 L -10 -20 L -6 -12" fill="none" stroke="#07090b" stroke-width="2"/>
          <path d="M -22 -8 L -6 -10 L -4 2 L -16 6 Z" fill="#06080a"/>
          <path d="M 4 -10 L 24 -8 L 20 6 L 6 4 Z" fill="#06080a"/>
          <path d="M 6 -4 L 18 -10 L 14 2 Z" fill="#80f8ff" filter="url(#csGlow)"/><path d="M -16 -2 L -8 -6 L -10 2 Z" fill="#4ce8ff"/>
          <path d="M 0 6 L -5 18 L 0 15 L 5 18 Z" fill="#06080a"/>
        </g>
        
      
        <g transform="translate(176,426) rotate(-12) scale(1.06,1.06)" stroke="#07090b" stroke-width="2.8" stroke-linejoin="miter">
          <path d="M -26 -14 C -24 -38, -6 -46, 12 -42 C 28 -38, 34 -22, 30 -2 L 34 8 L 24 18 L 20 34 L 12 36 L 8 28 L 2 36 L -4 34 L -8 26 L -14 34 L -20 26 L -20 14 L -30 4 Z"
                fill="url(#csBone)"/>
          <path d="M 10 -42 C 28 -38, 34 -22, 30 -2 L 34 8 L 24 18 L 20 34 L 4 34 L 6 16 L 18 10 L 20 -8 L 8 -18 L 16 -28 Z"
                fill="#090c10" stroke="none"/>
          <path d="M -6 -41 L -2 -28 L -10 -20 L -6 -12" fill="none" stroke="#07090b" stroke-width="2"/>
          <path d="M -22 -8 L -6 -10 L -4 2 L -16 6 Z" fill="#06080a"/>
          <path d="M 4 -10 L 24 -8 L 20 6 L 6 4 Z" fill="#06080a"/>
          <path d="M 6 -4 L 18 -10 L 14 2 Z" fill="#80f8ff" filter="url(#csGlow)"/><path d="M -16 -2 L -8 -6 L -10 2 Z" fill="#4ce8ff"/>
          <path d="M 0 6 L -5 18 L 0 15 L 5 18 Z" fill="#06080a"/>
        </g>
        
      
        <g transform="translate(336,426) rotate(12) scale(-1.06,1.06)" stroke="#07090b" stroke-width="2.8" stroke-linejoin="miter">
          <path d="M -26 -14 C -24 -38, -6 -46, 12 -42 C 28 -38, 34 -22, 30 -2 L 34 8 L 24 18 L 20 34 L 12 36 L 8 28 L 2 36 L -4 34 L -8 26 L -14 34 L -20 26 L -20 14 L -30 4 Z"
                fill="url(#csBone)"/>
          <path d="M 10 -42 C 28 -38, 34 -22, 30 -2 L 34 8 L 24 18 L 20 34 L 4 34 L 6 16 L 18 10 L 20 -8 L 8 -18 L 16 -28 Z"
                fill="#090c10" stroke="none"/>
          <path d="M -6 -41 L -2 -28 L -10 -20 L -6 -12" fill="none" stroke="#07090b" stroke-width="2"/>
          <path d="M -22 -8 L -6 -10 L -4 2 L -16 6 Z" fill="#06080a"/>
          <path d="M 4 -10 L 24 -8 L 20 6 L 6 4 Z" fill="#06080a"/>
          <path d="M 6 -4 L 18 -10 L 14 2 Z" fill="#80f8ff" filter="url(#csGlow)"/><path d="M -16 -2 L -8 -6 L -10 2 Z" fill="#4ce8ff"/>
          <path d="M 0 6 L -5 18 L 0 15 L 5 18 Z" fill="#06080a"/>
        </g>
        
      
        <g transform="translate(256,444) rotate(0) scale(1.24,1.24)" stroke="#07090b" stroke-width="2.8" stroke-linejoin="miter">
          <path d="M -26 -14 C -24 -38, -6 -46, 12 -42 C 28 -38, 34 -22, 30 -2 L 34 8 L 24 18 L 20 34 L 12 36 L 8 28 L 2 36 L -4 34 L -8 26 L -14 34 L -20 26 L -20 14 L -30 4 Z"
                fill="url(#csBone)"/>
          <path d="M 10 -42 C 28 -38, 34 -22, 30 -2 L 34 8 L 24 18 L 20 34 L 4 34 L 6 16 L 18 10 L 20 -8 L 8 -18 L 16 -28 Z"
                fill="#090c10" stroke="none"/>
          <path d="M -6 -41 L -2 -28 L -10 -20 L -6 -12" fill="none" stroke="#07090b" stroke-width="2"/>
          <path d="M -22 -8 L -6 -10 L -4 2 L -16 6 Z" fill="#06080a"/>
          <path d="M 4 -10 L 24 -8 L 20 6 L 6 4 Z" fill="#06080a"/>
          <path d="M 6 -4 L 18 -10 L 14 2 Z" fill="#80f8ff" filter="url(#csGlow)"/><path d="M -16 -2 L -8 -6 L -10 2 Z" fill="#4ce8ff"/>
          <path d="M 0 6 L -5 18 L 0 15 L 5 18 Z" fill="#06080a"/>
        </g>
        
    </g>

    <!-- Floating Glowing Cyan Soul Wisps -->
    <g class="cs-wisps" filter="url(#csGlow)">
      <circle cx="88" cy="112" r="5" fill="#9ef8ff"/>
      <circle cx="424" cy="108" r="5" fill="#9ef8ff"/>
      <circle cx="256" cy="58" r="4" fill="#d4ffff"/>
      <circle cx="64" cy="264" r="4.5" fill="#5cf2ff"/>
      <circle cx="448" cy="268" r="4.5" fill="#5cf2ff"/>
    </g>
    
</svg>
