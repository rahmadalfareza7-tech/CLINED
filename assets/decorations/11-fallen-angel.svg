<svg class="deco-11" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  
  <style class="deco-anim">@keyframes d11_flapL { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(10deg) translateX(-6px); } }
      @keyframes d11_flapR { 0%,100% { transform: translate(512px,0) scale(-1,1) rotate(0deg); } 50% { transform: translate(512px,0) scale(-1,1) rotate(10deg) translateX(-6px); } }
      .deco-11 g[filter*="faSh"] > g:first-child { transform-box: fill-box; transform-origin: 95% 28%; animation: d11_flapL 2.0s ease-in-out infinite; }
      .deco-11 g[filter*="faSh"] > g:last-child { transform-box: fill-box; transform-origin: 95% 28%; animation: d11_flapR 2.0s ease-in-out infinite; }</style>
  <defs>

    <linearGradient id="faBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#403345"/>
      <stop offset="35%" stop-color="#19131d"/>
      <stop offset="100%" stop-color="#07050a"/>
    </linearGradient>
    <linearGradient id="faRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c4a6cc"/>
      <stop offset="100%" stop-color="#5b4666"/>
    </linearGradient>
    <filter id="faSh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    
  </defs>

    <g filter="url(#faSh)">
      
    <g>
      <!-- Back long jagged primary blades -->
      <path d="M 156 84 C 110 24, 62 46, 36 118 C 18 176, 20 278, 34 388 C 52 342, 62 298, 70 256 C 58 322, 62 392, 82 448 C 98 394, 104 344, 108 298 C 102 362, 114 422, 146 462 C 154 404, 142 348, 134 298 C 110 248, 106 178, 142 126 Z"
            fill="url(#faBlade)" stroke="url(#faRim)" stroke-width="3.2" stroke-linejoin="round"/>
      <!-- Mid sharp feather tier -->
      <path d="M 146 96 C 102 58, 66 86, 52 152 C 42 214, 50 288, 66 356 C 78 310, 86 270, 92 234 C 86 294, 96 356, 120 402 C 126 346, 118 286, 120 232 C 122 184, 142 136, 166 106 Z"
            fill="#140f18" stroke="#e2d0ea" stroke-width="2.6" stroke-linejoin="round"/>
      <!-- Inner covert jagged plumes -->
      <path d="M 154 88 C 122 42, 82 54, 66 102 C 88 94, 106 94, 128 112 C 106 116, 86 138, 76 178 C 96 158, 116 148, 138 148 C 124 176, 114 212, 114 252 C 126 218, 136 184, 152 154 C 164 132, 174 114, 184 102 Z"
            fill="#241b2b" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round"/>
      <!-- Aggressive high shoulder spikes -->
      <path d="M 148 76 L 114 28 L 136 86 Z" fill="#1d1524" stroke="#f5ecfa" stroke-width="2"/>
      <path d="M 164 84 L 146 42 L 154 96 Z" fill="#1d1524" stroke="#f5ecfa" stroke-width="2"/>
      <!-- Crisp feather barb highlights -->
      <path d="M 58 134 Q 46 218, 56 312 M 82 136 Q 72 232, 86 344 M 104 152 Q 96 244, 114 348"
            fill="none" stroke="#c8b0d6" stroke-width="2.2" opacity="0.72" stroke-linecap="round"/>
      <!-- Floating loose black feathers -->
      <path d="M 48 418 Q 36 436, 44 454 Q 56 438, 48 418 Z" fill="#18121d" stroke="#bba2c9" stroke-width="1.5"/>
    </g>
    
      <g transform="translate(512,0) scale(-1,1)">
        
    <g>
      <!-- Back long jagged primary blades -->
      <path d="M 156 84 C 110 24, 62 46, 36 118 C 18 176, 20 278, 34 388 C 52 342, 62 298, 70 256 C 58 322, 62 392, 82 448 C 98 394, 104 344, 108 298 C 102 362, 114 422, 146 462 C 154 404, 142 348, 134 298 C 110 248, 106 178, 142 126 Z"
            fill="url(#faBlade)" stroke="url(#faRim)" stroke-width="3.2" stroke-linejoin="round"/>
      <!-- Mid sharp feather tier -->
      <path d="M 146 96 C 102 58, 66 86, 52 152 C 42 214, 50 288, 66 356 C 78 310, 86 270, 92 234 C 86 294, 96 356, 120 402 C 126 346, 118 286, 120 232 C 122 184, 142 136, 166 106 Z"
            fill="#140f18" stroke="#e2d0ea" stroke-width="2.6" stroke-linejoin="round"/>
      <!-- Inner covert jagged plumes -->
      <path d="M 154 88 C 122 42, 82 54, 66 102 C 88 94, 106 94, 128 112 C 106 116, 86 138, 76 178 C 96 158, 116 148, 138 148 C 124 176, 114 212, 114 252 C 126 218, 136 184, 152 154 C 164 132, 174 114, 184 102 Z"
            fill="#241b2b" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round"/>
      <!-- Aggressive high shoulder spikes -->
      <path d="M 148 76 L 114 28 L 136 86 Z" fill="#1d1524" stroke="#f5ecfa" stroke-width="2"/>
      <path d="M 164 84 L 146 42 L 154 96 Z" fill="#1d1524" stroke="#f5ecfa" stroke-width="2"/>
      <!-- Crisp feather barb highlights -->
      <path d="M 58 134 Q 46 218, 56 312 M 82 136 Q 72 232, 86 344 M 104 152 Q 96 244, 114 348"
            fill="none" stroke="#c8b0d6" stroke-width="2.2" opacity="0.72" stroke-linecap="round"/>
      <!-- Floating loose black feathers -->
      <path d="M 48 418 Q 36 436, 44 454 Q 56 438, 48 418 Z" fill="#18121d" stroke="#bba2c9" stroke-width="1.5"/>
    </g>
    
      </g>
    </g>
    
</svg>
