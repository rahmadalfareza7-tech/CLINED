<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>

    <linearGradient id="ssBright" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a8d8ff"/>
      <stop offset="100%" stop-color="#4e78cc"/>
    </linearGradient>
    <linearGradient id="ssDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#96c4ff"/>
      <stop offset="55%" stop-color="#4c6ec2"/>
      <stop offset="100%" stop-color="#273a78"/>
    </linearGradient>
    <linearGradient id="ssMoon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fff6c7"/>
      <stop offset="100%" stop-color="#a8d4ff"/>
    </linearGradient>
    <filter id="ssGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

    <!-- Luminous Celestial Orbit Ring -->
    <circle cx="256" cy="256" r="191" fill="none" stroke="#85c4ff" stroke-width="5" opacity="0.65" filter="url(#ssGlow)"/>
    <circle cx="256" cy="256" r="204" fill="none" stroke="#d6eeff" stroke-width="2" stroke-dasharray="10 18" opacity="0.55"/>

    <!-- Top Right Fluffy Anime Cloud -->
    <path d="M 272 72 C 288 40, 338 38, 358 66 C 392 58, 428 86, 418 118 C 436 132, 426 162, 396 158 L 294 114 C 266 106, 260 86, 272 72 Z"
          fill="url(#ssBright)"/>
    <path d="M 288 66 C 304 48, 334 48, 350 66 C 374 62, 404 78, 404 102" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

    <!-- Top Left Cloud -->
    <path d="M 84 134 C 82 102, 120 84, 144 102 C 166 84, 204 98, 198 128 C 168 138, 134 156, 112 180 C 84 180, 70 154, 84 134 Z"
          fill="url(#ssBright)"/>
    <path d="M 98 120 C 108 100, 130 98, 144 108" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>

    <!-- Right Floating Wisp Cloud -->
    <path d="M 380 222 C 392 200, 428 198, 438 218 C 460 220, 466 248, 444 258 L 386 256 C 370 250, 370 232, 380 222 Z"
          fill="url(#ssDeep)"/>
    <path d="M 392 220 C 404 206, 424 206, 432 220" fill="none" stroke="#e6f5ff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

    <!-- Bottom-Left Lush Dream Cloud + Gleaming Crescent Moon -->
    <path d="M 60 378 C 52 338, 90 310, 124 330 C 144 302, 194 314, 200 350 C 232 350, 254 378, 244 406 C 266 420, 258 460, 216 462 C 176 480, 114 472, 92 442 C 58 438, 44 406, 60 378 Z"
          fill="url(#ssDeep)"/>
    <!-- Gleaming Golden-Silver Crescent Moon nestled prominently on cloud -->
    <path d="M 144 334 A 44 44 0 1 0 202 396 A 35 35 0 1 1 144 334 Z"
          fill="url(#ssMoon)" stroke="#ffffff" stroke-width="2" filter="url(#ssGlow)"/>
    <!-- Front Moonlit Cloud Puff -->
    <path d="M 96 430 C 106 410, 144 408, 160 424 C 184 418, 214 430, 208 450 C 176 462, 114 458, 96 430 Z"
          fill="url(#ssBright)"/>
    <path d="M 110 416 C 122 402, 142 402, 154 416" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>

    <!-- Small Bottom-Right Cloud -->
    <path d="M 340 382 C 354 362, 392 364, 400 384 C 420 388, 422 414, 400 422 L 344 418 C 326 412, 328 394, 340 382 Z"
          fill="url(#ssDeep)"/>

    <polygon points="116.0,88.0 102.8,90.8 100.0,104.0 97.2,90.8 84.0,88.0 97.2,85.2 100.0,72.0 102.8,85.2" fill="#ffffff" opacity="0.98" filter="url(#ssGlow)"/>
<polygon points="264.0,52.0 249.2,55.2 246.0,70.0 242.8,55.2 228.0,52.0 242.8,48.8 246.0,34.0 249.2,48.8" fill="#fff8cc" opacity="0.98" filter="url(#ssGlow)"/>
<polygon points="437.0,126.0 424.7,128.7 422.0,141.0 419.3,128.7 407.0,126.0 419.3,123.3 422.0,111.0 424.7,123.3" fill="#ffffff" opacity="0.98" filter="url(#ssGlow)"/>
