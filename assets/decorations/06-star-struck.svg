<polygon points="135.0,452.0 126.0,454.0 124.0,463.0 122.0,454.0 113.0,452.0 122.0,450.0 124.0,441.0 126.0,450.0" fill="#d6efff" opacity="0.98" filter="url(#ssGlow)"/>
<polygon points="316.0,456.0 307.8,457.8 306.0,466.0 304.2,457.8 296.0,456.0 304.2,454.2 306.0,446.0 307.8,454.2" fill="#fff8cc" opacity="0.98" filter="url(#ssGlow)"/>
