<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>

    <linearGradient id="rkEar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff9e8"/>
      <stop offset="55%" stop-color="#f5d5b3"/>
      <stop offset="100%" stop-color="#c99068"/>
    </linearGradient>
    <linearGradient id="rkEarIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd1e6"/>
      <stop offset="100%" stop-color="#f26ba8"/>
    </linearGradient>
    <linearGradient id="rkRibbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffcce2"/>
      <stop offset="45%" stop-color="#ff7ab5"/>
      <stop offset="100%" stop-color="#c93879"/>
    </linearGradient>
    <linearGradient id="rkBell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8b8"/>
      <stop offset="35%" stop-color="#ffd24d"/>
      <stop offset="75%" stop-color="#d98a14"/>
      <stop offset="100%" stop-color="#7d4305"/>
    </linearGradient>
    <linearGradient id="rkPaw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0ccb0"/>
      <stop offset="65%" stop-color="#c99776"/>
      <stop offset="100%" stop-color="#966649"/>
    </linearGradient>
    <filter id="rkSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#240f1e" flood-opacity="0.45"/>
    </filter>
    <filter id="rkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

    <!-- Soft Pearlescent Rose Rim Glow -->
    <circle cx="256" cy="256" r="188" fill="none" stroke="#ffb8d9" stroke-width="5" opacity="0.68" filter="url(#rkGlow)"/>

    <g filter="url(#rkSh)">
      <!-- Left Ear -->
      <path d="M 96 188 C 80 122, 90 58, 118 50 C 152 42, 204 82, 224 116 C 180 124, 132 150, 96 188 Z"
            fill="url(#rkEar)" stroke="#241520" stroke-width="8" stroke-linejoin="round"/>
      <path d="M 114 162 C 104 122, 112 82, 128 76 C 150 70, 184 96, 198 118 C 168 126, 138 142, 114 162 Z"
            fill="url(#rkEarIn)"/>
      <path d="M 108 150 C 122 138, 134 134, 144 132" fill="none" stroke="#fff6e6" stroke-width="6.5" stroke-linecap="round"/>

      <!-- Right Ear -->
      <path d="M 416 188 C 432 122, 422 58, 394 50 C 360 42, 308 82, 288 116 C 332 124, 380 150, 416 188 Z"
            fill="url(#rkEar)" stroke="#241520" stroke-width="8" stroke-linejoin="round"/>
      <path d="M 398 162 C 408 122, 400 82, 384 76 C 362 70, 328 96, 314 118 C 344 126, 374 142, 398 162 Z"
            fill="url(#rkEarIn)"/>
      <path d="M 404 150 C 390 138, 378 134, 368 132" fill="none" stroke="#fff6e6" stroke-width="6.5" stroke-linecap="round"/>

      <!-- Lush 3D Satin Ribbon Bow (Left) -->
      <g transform="translate(102,182) rotate(-18)">
        <!-- Flowing wavy tails -->
        <path d="M -8 8 C -24 34, -44 54, -38 82 L -18 70 L -6 86 C -4 56, 2 30, 4 12 Z" fill="url(#rkRibbon)" stroke="#241520" stroke-width="6" stroke-linejoin="round"/>
        <path d="M 6 8 C 20 34, 34 54, 28 78 L 12 68 L 0 80 C 0 54, -2 28, -4 12 Z" fill="url(#rkRibbon)" stroke="#241520" stroke-width="6" stroke-linejoin="round"/>
        <!-- Plump satin loops with inner fold shading -->
        <path d="M 0 0 C -30 -32, -56 -8, -42 18 C -28 36, -8 18, 0 4 Z" fill="url(#rkRibbon)" stroke="#241520" stroke-width="6"/>
        <path d="M 0 0 C 30 -32, 56 -8, 42 18 C 28 36, 8 18, 0 4 Z" fill="url(#rkRibbon)" stroke="#241520" stroke-width="6"/>
        <!-- Satin sheen highlights -->
        <path d="M -32 -6 C -22 -14, -12 -10, -8 -4 M 32 -6 C 22 -14, 12 -10, 8 -4" stroke="#fff0f7" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
        <ellipse cx="0" cy="4" rx="12" ry="11" fill="#ff9cc8" stroke="#241520" stroke-width="5.5"/>
        <circle cx="-3" cy="1" r="3" fill="#ffffff" opacity="0.85"/>
      </g>

      <!-- Lush 3D Satin Ribbon Bow (Right) -->
      <g transform="translate(410,182) rotate(18)">
        <path d="M -6 8 C -20 34, -34 54, -28 78 L -12 68 L 0 80 C 0 54, 2 28, 4 12 Z" fill="url(#rkRibbon)" stroke="#241520" stroke-width="6" stroke-linejoin="round"/>
        <path d="M 8 8 C 24 34, 44 54, 38 82 L 18 70 L 6 86 C 4 56, -2 30, -4 12 Z" fill="url(#rkRibbon)" stroke="#241520" stroke-width="6" stroke-linejoin="round"/>
        <path d="M 0 0 C -30 -32, -56 -8, -42 18 C -28 36, -8 18, 0 4 Z" fill="url(#rkRibbon)" stroke="#241520" stroke-width="6"/>
        <path d="M 0 0 C 30 -32, 56 -8, 42 18 C 28 36, 8 18, 0 4 Z" fill="url(#rkRibbon)" stroke="#241520" stroke-width="6"/>
        <path d="M -32 -6 C -22 -14, -12 -10, -8 -4 M 32 -6 C 22 -14, 12 -10, 8 -4" stroke="#fff0f7" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
        <ellipse cx="0" cy="4" rx="12" ry="11" fill="#ff9cc8" stroke="#241520" stroke-width="5.5"/>
        <circle cx="-3" cy="1" r="3" fill="#ffffff" opacity="0.85"/>
      </g>

      <!-- Velvet Collar Band with Highlights -->
      <path d="M 144 404 Q 256 468, 368 404" fill="none" stroke="#241520" stroke-width="26" stroke-linecap="round"/>
      <path d="M 144 404 Q 256 468, 368 404" fill="none" stroke="#d94e8f" stroke-width="15" stroke-linecap="round"/>
      <path d="M 164 414 Q 256 464, 348 414" fill="none" stroke="#ff9ec9" stroke-width="4" stroke-linecap="round" opacity="0.75"/>

      <!-- Gleaming 3D Golden Bell -->
      <circle cx="256" cy="448" r="25" fill="url(#rkBell)" stroke="#241520" stroke-width="6.5"/>
      <path d="M 236 449 Q 256 461, 276 449" fill="none" stroke="#241520" stroke-width="5.5"/>
      <circle cx="256" cy="456" r="5.5" fill="#241520"/>
      <ellipse cx="246" cy="437" rx="7" ry="4" fill="#ffffff" opacity="0.9" transform="rotate(-28 246 437)"/>

      <!-- Chubby Shaded Paws (Left & Right) -->
      <g transform="translate(148,402) rotate(14)">
        <ellipse cx="0" cy="0" rx="40" ry="29" fill="url(#rkPaw)" stroke="#241520" stroke-width="7"/>
        <ellipse cx="-8" cy="-10" rx="18" ry="8" fill="#fae2ce" opacity="0.55"/>
        <path d="M -16 -27 L -13 -3 M 2 -29 L 2 -3 M 20 -25 L 16 -1" stroke="#241520" stroke-width="5.5" stroke-linecap="round"/>
      </g>
      <g transform="translate(364,402) rotate(-14)">
        <ellipse cx="0" cy="0" rx="40" ry="29" fill="url(#rkPaw)" stroke="#241520" stroke-width="7"/>
        <ellipse cx="8" cy="-10" rx="18" ry="8" fill="#fae2ce" opacity="0.55"/>
        <path d="M -20 -25 L -16 -1 M -2 -29 L -2 -3 M 16 -27 L 13 -3" stroke="#241520" stroke-width="5.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Gleaming Sparkles around Bell & Bows -->
    <g filter="url(#rkGlow)">
      <polygon points="303.0,434.0 290.5,436.5 288.0,449.0 285.5,436.5 273.0,434.0 285.5,431.5 288.0,419.0 290.5,431.5" fill="#fff8cc" opacity="0.98" />
      <polygon points="84.0,134.0 74.1,136.1 72.0,146.0 69.9,136.1 60.0,134.0 69.9,131.9 72.0,122.0 74.1,131.9" fill="#ffd6eb" opacity="0.92" />
      <polygon points="452.0,134.0 442.1,136.1 440.0,146.0 437.9,136.1 428.0,134.0 437.9,131.9 440.0,122.0 442.1,131.9" fill="#ffd6eb" opacity="0.92" />
    </g>
    
</svg>
