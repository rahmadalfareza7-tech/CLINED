<svg class="deco-07" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  
  <style class="deco-anim">@keyframes d07_spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes d07_twink { 0%,100% { transform: scale(0.55) rotate(0deg); opacity: 0.45; } 50% { transform: scale(1.4) rotate(40deg); opacity: 1; } }
      .deco-07 g[mask*="tdRingMask"] { transform-origin: 256px 256px; animation: d07_spin 22s linear infinite; }
      .deco-07 polygon[filter*="tdGlow"] { transform-box: fill-box; transform-origin: center; animation: d07_twink 2.0s ease-in-out infinite; }</style>
  <defs>

    <radialGradient id="tdRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5e6" stop-opacity="0.92"/>
      <stop offset="45%" stop-color="#f2b8d8" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#7c4da8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tdGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#ffe0a3" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#8068a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tdCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8ffff" stop-opacity="0.82"/>
      <stop offset="48%" stop-color="#a8c8ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4e468a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tdRingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5d6"/>
      <stop offset="35%" stop-color="#ffb8e0"/>
      <stop offset="70%" stop-color="#b5a6ff"/>
      <stop offset="100%" stop-color="#fff0cc"/>
    </linearGradient>
    <filter id="tdBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="tdGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="tdRingMask">
      <rect width="512" height="512" fill="white"/>
      <circle cx="256" cy="256" r="172" fill="black"/>
    </mask>
    
  </defs>

    <g mask="url(#tdRingMask)">
      <g filter="url(#tdBlur)">
        <circle cx="444.7" cy="256.0" r="40.8" fill="url(#tdRose)"/><circle cx="453.7" cy="309.0" r="58.8" fill="url(#tdGold)"/><circle cx="424.6" cy="353.3" r="41.3" fill="url(#tdCyan)"/><circle cx="399.5" cy="399.5" r="37.0" fill="url(#tdRose)"/><circle cx="354.4" cy="426.4" r="53.1" fill="url(#tdGold)"/><circle cx="309.5" cy="455.5" r="42.9" fill="url(#tdCyan)"/><circle cx="256.0" cy="450.7" r="37.0" fill="url(#tdRose)"/><circle cx="205.2" cy="445.4" r="49.8" fill="url(#tdGold)"/><circle cx="158.4" cy="425.0" r="46.8" fill="url(#tdCyan)"/><circle cx="116.0" cy="396.0" r="53.7" fill="url(#tdRose)"/><circle cx="78.4" cy="358.5" r="59.9" fill="url(#tdGold)"/><circle cx="66.1" cy="306.9" r="55.1" fill="url(#tdCyan)"/><circle cx="55.9" cy="256.0" r="43.0" fill="url(#tdRose)"/><circle cx="73.4" cy="207.1" r="47.1" fill="url(#tdGold)"/><circle cx="91.3" cy="160.9" r="40.1" fill="url(#tdCyan)"/><circle cx="122.4" cy="122.4" r="36.4" fill="url(#tdRose)"/><circle cx="159.5" cy="88.8" r="52.6" fill="url(#tdGold)"/><circle cx="205.0" cy="65.7" r="54.1" fill="url(#tdCyan)"/><circle cx="256.0" cy="50.2" r="59.6" fill="url(#tdRose)"/><circle cx="304.0" cy="77.0" r="48.6" fill="url(#tdGold)"/><circle cx="359.5" cy="76.7" r="54.0" fill="url(#tdCyan)"/><circle cx="397.3" cy="114.7" r="49.0" fill="url(#tdRose)"/><circle cx="424.2" cy="158.9" r="57.3" fill="url(#tdGold)"/><circle cx="435.8" cy="207.8" r="45.4" fill="url(#tdCyan)"/>
      </g>
