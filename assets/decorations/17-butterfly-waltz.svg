  <style class="deco-anim">@keyframes d17_float { 0%,100% { transform: translate(0px, 0px); } 50% { transform: translate(3px, -7px); } }
@keyframes d17_sp { 0%,100% { transform: scale(0.6); opacity: 0.45; } 50% { transform: scale(1.38); opacity: 1; } }
.deco-17 .bf-item { animation: d17_float 2.2s ease-in-out infinite; }
.deco-17 polygon[filter*="bwGlow"] { transform-box: fill-box; transform-origin: center; animation: d17_sp 1.9s ease-in-out infinite; }</style>
  <defs>

    <linearGradient id="bwWing1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffe9a8"/>
      <stop offset="72%" stop-color="#ffb8e6"/>
      <stop offset="100%" stop-color="#a89eff"/>
    </linearGradient>
    <linearGradient id="bwWing2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d4f4ff"/>
      <stop offset="80%" stop-color="#c9b8ff"/>
      <stop offset="100%" stop-color="#ff9ed8"/>
    </linearGradient>
    <linearGradient id="bwTrail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="50%" stop-color="#ffb8e6"/>
      <stop offset="100%" stop-color="#b5c8ff"/>
    </linearGradient>
    <filter id="bwGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

