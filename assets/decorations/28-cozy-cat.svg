<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <style class="deco-anim">
    @keyframes d2_07_br { 0%,100%{transform:scale(1.00, 0.97) translateY(2px)} 50%{transform:scale(1.025, 1.045) translateY(-3px)} }
    @keyframes d2_07_z1 { 0%{transform:translate(0,10px) scale(0.6);opacity:0} 25%{opacity:0.95} 80%{opacity:0.7} 100%{transform:translate(22px,-44px) scale(1.15);opacity:0} }
    .d2_07-cat { transform-origin: 256px 140px; animation: d2_07_br 3.0s ease-in-out infinite; }
    .d2_07-z1 { animation: d2_07_z1 3.0s ease-out infinite; }
    .d2_07-z2 { animation: d2_07_z1 3.0s ease-out 1.0s infinite; }
    .d2_07-z3 { animation: d2_07_z1 3.0s ease-out 2.0s infinite; }
  </style>
  <image class="d2_07-cat" href="data:image/webp;base64," x="0" y="0" width="512" height="512"/>
  <g font-family="system-ui, sans-serif" font-weight="900" fill="#fef3c7" stroke="#5c2d16" stroke-width="2.2" paint-order="stroke">
    <text class="d2_07-z1" x="342" y="96" font-size="22">z</text>
    <text class="d2_07-z2" x="358" y="76" font-size="28">Z</text>
    <text class="d2_07-z3" x="378" y="54" font-size="20">z</text>
  </g>
</svg>