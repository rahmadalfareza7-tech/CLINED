      <stop offset="0%" stop-color="#101215"/>
      <stop offset="46%" stop-color="#13161b"/>
      <stop offset="85%" stop-color="#182026"/>
      <stop offset="100%" stop-color="#0b0f14"/>
    </linearGradient>
