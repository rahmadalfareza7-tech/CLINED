<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120">
  
  <style class="np-anim">@keyframes a16_flut { 0%,100% { transform: translateY(0px) scale(0.95); } 50% { transform: translateY(-12px) scale(1.08); } }
        @keyframes a16_aur { 0%,100% { transform: translateX(-22px); opacity: 0.45; } 50% { transform: translateX(22px); opacity: 0.95; } }
        path[fill*="aur16"] { animation: a16_aur 3.2s ease-in-out infinite; }
        g[filter*="glow16"] { transform-box: fill-box; transform-origin: center; animation: a16_flut 2.0s ease-in-out infinite; }</style>
  <defs>

    <linearGradient id="bg16" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#171229"/>
      <stop offset="46%" stop-color="#2c1f52"/>
      <stop offset="80%" stop-color="#5e3a8c"/>
      <stop offset="100%" stop-color="#a65cb0"/>
    </linearGradient>
    <linearGradient id="aur16" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ff9ee0" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#9ef2ff" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="bf16" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffe9a8"/>
      <stop offset="72%" stop-color="#ffb8e6"/>
      <stop offset="100%" stop-color="#9ed4ff"/>
    </linearGradient>
    <filter id="blur16" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="glow16" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>
  <clipPath id="npClip"><rect width="640" height="120"/></clipPath>
