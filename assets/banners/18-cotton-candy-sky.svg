<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120">
  
  <style class="np-anim">@keyframes a18_drift { 0%,100% { transform: translateX(-16px); } 50% { transform: translateX(16px); } }
        @keyframes a18_sun { 0%,100% { transform: scale(0.92); opacity: 0.8; } 50% { transform: scale(1.12); opacity: 1; } }
        @keyframes a18_star { 0%,100% { transform: scale(0.55); opacity: 0.4; } 50% { transform: scale(1.4); opacity: 1; } }
        path[fill*="cc18a"] { animation: a18_drift 3.8s ease-in-out infinite; }
        circle[cx="576"] { transform-box: fill-box; transform-origin: center; animation: a18_sun 2.6s ease-in-out infinite; }
        g[filter*="glow18"] polygon { transform-box: fill-box; transform-origin: center; animation: a18_star 1.8s ease-in-out infinite; }</style>
  <defs>

    <linearGradient id="bg18" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f1436"/>
      <stop offset="44%" stop-color="#593278"/>
      <stop offset="76%" stop-color="#db6aa8"/>
      <stop offset="100%" stop-color="#ffc2d9"/>
    </linearGradient>
    <linearGradient id="cc18a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="46%" stop-color="#ffd1eb"/>
      <stop offset="100%" stop-color="#9cbdff"/>
    </linearGradient>
    <linearGradient id="cc18b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe6f2"/>
      <stop offset="60%" stop-color="#d49eff"/>
      <stop offset="100%" stop-color="#7068ba"/>
    </linearGradient>
    <filter id="glow18" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>
  <clipPath id="npClip"><rect width="640" height="120"/></clipPath>
  <g clip-path="url(#npClip)">

    <rect width="640" height="120" fill="url(#bg18)"/>
    <circle cx="576" cy="44" r="36" fill="#fff8db" opacity="0.95" filter="url(#glow18)"/>
    <!-- Back Lavender-Rose Cumulus Layer -->
    <path d="M 380 120 C 396 88, 434 78, 462 92 C 480 64, 526 62, 548 88 C 570 70, 610 68, 626 88 C 632 82, 638 80, 640 82 L 640 120 Z" fill="url(#cc18b)"/>
    <!-- Front Backlit Cotton-Candy Cloud Puffs -->
    <path d="M 426 120 C 444 98, 484 92, 510 106 C 534 88, 578 88, 598 106 C 616 94, 630 94, 640 98 L 640 120 Z" fill="url(#cc18a)"/>
    <path d="M 442 104 C 464 94, 488 94, 506 106 M 542 94 C 562 88, 582 92, 596 104" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" opacity="0.88"/>
    <g filter="url(#glow18)">
      <polygon points="486.0,28.0 476.1,30.1 474.0,40.0 471.9,30.1 462.0,28.0 471.9,25.9 474.0,16.0 476.1,25.9" fill="#ffffff" opacity="0.98" />
      <polygon points="533.0,46.0 525.7,47.7 524.0,55.0 522.3,47.7 515.0,46.0 522.3,44.3 524.0,37.0 525.7,44.3" fill="#fff5cc" opacity="0.96" />
      <polygon points="632.0,20.0 623.8,21.8 622.0,30.0 620.2,21.8 612.0,20.0 620.2,18.2 622.0,10.0 623.8,18.2" fill="#ffffff" opacity="0.98" />
    </g>
    
  </g>
</svg>
