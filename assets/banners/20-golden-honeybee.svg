<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120">
  
  <style class="np-anim">@keyframes a20_hop { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-9px); } }
        @keyframes a20_drip { 0% { transform: translateY(0px); opacity: 1; } 80% { opacity: 0.9; } 100% { transform: translateY(48px); opacity: 0; } }
        @keyframes a20_star { 0%,100% { transform: scale(0.55) rotate(0deg); opacity: 0.45; } 50% { transform: scale(1.45) rotate(35deg); opacity: 1; } }
        g[filter*="sh20"] { animation: a20_hop 1.6s ease-in-out infinite; }
        .a20-drop { animation: a20_drip 2.0s ease-in infinite; }
        g[filter*="glow20"] polygon { transform-box: fill-box; transform-origin: center; animation: a20_star 1.8s ease-in-out infinite; }</style>
  <defs>

    <linearGradient id="bg20" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c1408"/>
      <stop offset="48%" stop-color="#402d0d"/>
      <stop offset="84%" stop-color="#8f6315"/>
      <stop offset="100%" stop-color="#d49a22"/>
    </linearGradient>
    <linearGradient id="honeyCell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2a6"/>
      <stop offset="45%" stop-color="#ffb82b"/>
      <stop offset="100%" stop-color="#a85e08"/>
    </linearGradient>
    <linearGradient id="honeyDrip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="55%" stop-color="#f29b18"/>
      <stop offset="100%" stop-color="#b55905"/>
    </linearGradient>
    <linearGradient id="plush20" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#fff4db"/>
      <stop offset="100%" stop-color="#dfc394"/>
    </linearGradient>
    <linearGradient id="bell20" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff9bd"/>
      <stop offset="45%" stop-color="#ffd247"/>
      <stop offset="100%" stop-color="#a86208"/>
    </linearGradient>
    <filter id="glow20" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sh20" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#291604" flood-opacity="0.5"/>
    </filter>
    
  </defs>
  <clipPath id="npClip"><rect width="640" height="120"/></clipPath>
  <g clip-path="url(#npClip)">

    <rect width="640" height="120" fill="url(#bg20)"/>
    <!-- Backlit Golden Honeycomb Lattice -->
    <polygon points="481.6,45.0 466.0,54.0 450.4,45.0 450.4,27.0 466.0,18.0 481.6,27.0" fill="url(#honeyCell)" fill-opacity="0.22" stroke="#ffe885" stroke-width="1.4" stroke-opacity="0.65"/><polygon points="513.6,45.0 498.0,54.0 482.4,45.0 482.4,27.0 498.0,18.0 513.6,27.0" fill="url(#honeyCell)" fill-opacity="0.38" stroke="#ffe885" stroke-width="1.4" stroke-opacity="0.65"/><polygon points="545.6,45.0 530.0,54.0 514.4,45.0 514.4,27.0 530.0,18.0 545.6,27.0" fill="url(#honeyCell)" fill-opacity="0.48" stroke="#ffe885" stroke-width="1.4" stroke-opacity="0.65"/><polygon points="617.6,45.0 602.0,54.0 586.4,45.0 586.4,27.0 602.0,18.0 617.6,27.0" fill="url(#honeyCell)" fill-opacity="0.55" stroke="#ffe885" stroke-width="1.4" stroke-opacity="0.65"/><polygon points="649.6,45.0 634.0,54.0 618.4,45.0 618.4,27.0 634.0,18.0 649.6,27.0" fill="url(#honeyCell)" fill-opacity="0.48" stroke="#ffe885" stroke-width="1.4" stroke-opacity="0.65"/><polygon points="465.6,73.0 450.0,82.0 434.4,73.0 434.4,55.0 450.0,46.0 465.6,55.0" fill="url(#honeyCell)" fill-opacity="0.16" stroke="#ffe885" stroke-width="1.4" stroke-opacity="0.65"/><polygon points="497.6,73.0 482.0,82.0 466.4,73.0 466.4,55.0 482.0,46.0 497.6,55.0" fill="url(#honeyCell)" fill-opacity="0.32" stroke="#ffe885" stroke-width="1.4" stroke-opacity="0.65"/><polygon points="529.6,73.0 514.0,82.0 498.4,73.0 498.4,55.0 514.0,46.0 529.6,55.0" fill="url(#honeyCell)" fill-opacity="0.44" stroke="#ffe885" stroke-width="1.4" stroke-opacity="0.65"/><polygon points="633.6,73.0 618.0,82.0 602.4,73.0 602.4,55.0 618.0,46.0 633.6,55.0" fill="url(#honeyCell)" fill-opacity="0.56" stroke="#ffe885" stroke-width="1.4" stroke-opacity="0.65"/><polygon points="513.6,101.0 498.0,110.0 482.4,101.0 482.4,83.0 498.0,74.0 513.6,83.0" fill="url(#honeyCell)" fill-opacity="0.28" stroke="#ffe885" stroke-width="1.4" stroke-opacity="0.65"/><polygon points="617.6,101.0 602.0,110.0 586.4,101.0 586.4,83.0 602.0,74.0 617.6,83.0" fill="url(#honeyCell)" fill-opacity="0.52" stroke="#ffe885" stroke-width="1.4" stroke-opacity="0.65"/><polygon points="649.6,101.0 634.0,110.0 618.4,101.0 618.4,83.0 634.0,74.0 649.6,83.0" fill="url(#honeyCell)" fill-opacity="0.45" stroke="#ffe885" stroke-width="1.4" stroke-opacity="0.65"/>
    <!-- Glossy Dripping Golden Honey along Top-Right Rim -->
    <path d="M 476 0 L 640 0 L 640 28 C 632 34, 624 30, 622 18 C 618 10, 610 12, 608 26 C 606 42, 594 42, 592 24 C 590 12, 578 12, 574 20 C 566 28, 554 22, 552 12 C 546 4, 532 6, 526 16 C 518 24, 506 20, 504 10 C 500 2, 488 0, 476 0 Z"
          fill="url(#honeyDrip)" stroke="#8c4404" stroke-width="1.1"/>
    <path d="M 602 18 C 602 28, 600 34, 598 36 M 520 8 C 518 14, 516 17, 514 17" fill="none" stroke="#fffce0" stroke-width="2" stroke-linecap="round" opacity="0.88"/>

    <!-- Super Cute Polished Cel-Shaded Plush Golden Mascot (One-Dennyboo Style!) -->
    <g filter="url(#sh20)" stroke="#241508" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
      <!-- Floppy Curved Golden-Trimmed Plush Ears -->
      <path d="M 538 40 C 520 28, 512 12, 524 8 C 534 5, 546 18, 548 34 Z" fill="url(#plush20)"/>
      <path d="M 534 32 C 526 22, 522 14, 527 13 C 532 12, 540 20, 542 30 Z" fill="#ffb866" stroke="none"/>
      <path d="M 580 40 C 598 28, 606 12, 594 8 C 584 5, 572 18, 570 34 Z" fill="url(#plush20)"/>
      <path d="M 584 32 C 592 22, 596 14, 591 13 C 586 12, 578 20, 576 30 Z" fill="#ffb866" stroke="none"/>

      <!-- Plump Chubby Rounded Mascot Hoodie Body -->
      <path d="M 516 120 C 512 86, 520 42, 540 34 C 552 29, 566 29, 578 34 C 598 42, 606 86, 602 120 Z" fill="url(#plush20)"/>
      <!-- Soft top highlight on hoodie -->
      <path d="M 538 40 Q 559 33, 580 40" fill="none" stroke="#ffffff" stroke-width="2.6" opacity="0.85"/>

      <!-- Glossy Dark Visor / Face Oval with Cute Glowing Happy Eyes -->
      <ellipse cx="559" cy="64" rx="25" ry="18" fill="#261c18" stroke="#241508" stroke-width="3"/>
      <!-- Happy Sparkling Amber-Gold Curved Eyes -->
      <path d="M 544 63 Q 549 56, 554 63 M 564 63 Q 569 56, 574 63" fill="none" stroke="#ffdf66" stroke-width="3.2"/>
      <!-- Soft Rosy Blush Dots -->
      <ellipse cx="541" cy="69" rx="4.2" ry="2.2" fill="#ff85a8" stroke="none" opacity="0.8"/>
      <ellipse cx="577" cy="69" rx="4.2" ry="2.2" fill="#ff85a8" stroke="none" opacity="0.8"/>
      <!-- Tiny Cute Smile -->
      <path d="M 555 68 Q 559 72, 563 68" fill="none" stroke="#ffdf66" stroke-width="2.2"/>

      <!-- Crimson Lucky Silk Collar + Gleaming 3D Golden Bell -->
      <path d="M 526 90 Q 559 104, 592 90" fill="none" stroke="#d9233d" stroke-width="9" stroke-linecap="round"/>
      <path d="M 534 92 Q 559 102, 584 92" fill="none" stroke="#ff7a8f" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
      <circle cx="559" cy="100" r="11.5" fill="url(#bell20)" stroke="#241508" stroke-width="3"/>
      <path d="M 550 101 Q 559 106, 568 101" fill="none" stroke="#241508" stroke-width="2.4"/>
      <circle cx="555" cy="95.5" r="2.8" fill="#ffffff" stroke="none" opacity="0.92"/>

      <!-- Plump Little Plush Paws Tucked in Front -->
      <ellipse cx="528" cy="112" rx="13" ry="9" fill="url(#plush20)" transform="rotate(14 528 112)"/>
      <ellipse cx="590" cy="112" rx="13" ry="9" fill="url(#plush20)" transform="rotate(-14 590 112)"/>
    </g>

    <!-- Warm Sunlit Honey Sparkles -->
    <g filter="url(#glow20)">
      <polygon points="487.0,30.0 478.0,32.0 476.0,41.0 474.0,32.0 465.0,30.0 474.0,28.0 476.0,19.0 478.0,28.0" fill="#fff8cc" opacity="0.98" />
      <polygon points="632.0,82.0 623.8,83.8 622.0,92.0 620.2,83.8 612.0,82.0 620.2,80.2 622.0,72.0 623.8,80.2" fill="#ffffff" opacity="0.96" />
      <polygon points="500.0,92.0 493.6,93.6 492.0,100.0 490.4,93.6 484.0,92.0 490.4,90.4 492.0,84.0 493.6,90.4" fill="#ffe680" opacity="0.94" />
    </g>

    <!-- NP_FX_START -->
<g class="np-fx">
          <path class="a20-drop" d="M 600 32 C 605 40, 606 47, 600 49 C 594 47, 595 40, 600 32 Z" fill="#ffe066"/>
        </g>
    <!-- NP_FX_END -->
  </g>
</svg>
