    .v6_23-sp1 { animation: v6_23_spark1 2.3s ease-out infinite; }
    .v6_23-sp2 { animation: v6_23_spark1 3.0s ease-out 1.0s infinite; }
    .v6_23-st1 { transform-origin: 552.0px 39.3px; animation: v6_23_star 2.1s ease-in-out infinite; }
    .v6_23-st2 { transform-origin: 626.0px 82.0px; animation: v6_23_star 2.5s ease-in-out 1.1s infinite; }
