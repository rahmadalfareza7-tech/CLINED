      25% { opacity: 0.95; }
      80% { opacity: 0.6; }
      100% { transform: translate(-24px,-32px) scale(0.3); opacity: 0; }
    }
    @keyframes v6_23_star {
      0%,100% { transform: scale(0.65) rotate(0deg); opacity: 0.35; }
      50% { transform: scale(1.22) rotate(22deg); opacity: 1; }
