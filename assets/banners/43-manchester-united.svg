<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120">
  <style class="np-anim">
    @keyframes v6_21_float {
      0%,100% { transform: translateY(2.5px) scale(1.00) rotate(-1.6deg); }
      50% { transform: translateY(-3.5px) scale(1.06) rotate(1.6deg); }
    }
    @keyframes v6_21_aura {
      0%,100% { opacity: 0.25; transform: scale(0.92); }
      50% { opacity: 0.58; transform: scale(1.14); }
    }
    @keyframes v6_21_spark1 {
      0% { transform: translate(0,10px) scale(0.6); opacity: 0; }
      25% { opacity: 0.95; }
      80% { opacity: 0.6; }
      100% { transform: translate(-24px,-32px) scale(0.3); opacity: 0; }
    }
    @keyframes v6_21_star {
      0%,100% { transform: scale(0.65) rotate(0deg); opacity: 0.35; }
      50% { transform: scale(1.22) rotate(22deg); opacity: 1; }
    }
    .v6_21-crest { transform-origin: 602.3px 70.0px; animation: v6_21_float 2.7s ease-in-out infinite; }
    .v6_21-aura { transform-origin: 602.3px 70.0px; animation: v6_21_aura 2.7s ease-in-out infinite; }
    .v6_21-sp1 { animation: v6_21_spark1 2.3s ease-out infinite; }
    .v6_21-sp2 { animation: v6_21_spark1 3.0s ease-out 1.0s infinite; }
    .v6_21-st1 { transform-origin: 546.0px 32.0px; animation: v6_21_star 2.1s ease-in-out infinite; }
    .v6_21-st2 { transform-origin: 626.0px 104.0px; animation: v6_21_star 2.5s ease-in-out 1.1s infinite; }
  </style>
  <defs>
