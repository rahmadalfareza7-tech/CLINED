<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120">
  <style class="np-anim">
    @keyframes v7_11_orange {
      0%,100% { transform: translate(0px, 2px) rotate(2deg); }
      25% { transform: translate(-1px, -3px) rotate(-2deg); }
      45% { transform: translate(-2px, -4px) rotate(-3deg); }
      50% { transform: translate(5px, -1px) rotate(7deg) scale(0.95); }
      64% { transform: translate(0px, -3px) rotate(-1deg) scale(1.02); }
    }
    @keyframes v7_11_grey {
      0%,100% { transform: translate(-14px, 28px) rotate(-14deg); }
      24% { transform: translate(-6px, 10px) rotate(-8deg); }
      46% { transform: translate(34px, -6px) rotate(18deg) scale(1.03); }
      52% { transform: translate(36px, -4px) rotate(20deg) scale(0.98); }
      72% { transform: translate(-8px, 14px) rotate(-10deg); }
    }
    @keyframes v7_11_burst {
      0%,43% { transform: scale(0.2); opacity: 0; }
      49% { transform: scale(1.22); opacity: 1; }
      68% { transform: scale(1.5) translateY(-6px); opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes v7_11_heart {
      0%,45% { transform: translate(0px, 4px) scale(0.3); opacity: 0; }
      53% { transform: translate(-4px, -8px) scale(1.12); opacity: 1; }
      80% { transform: translate(-8px, -26px) scale(0.85); opacity: 0; }
      100% { opacity: 0; }
    }
    .v7-11-orange { transform-origin: 598.7px 126px; animation: v7_11_orange 2.4s ease-in-out infinite; }
    .v7-11-grey { transform-origin: 534.7px 128.0px; animation: v7_11_grey 2.4s ease-in-out infinite; }
    .v7-11-burst { transform-origin: 590.7px 73.4px; animation: v7_11_burst 2.4s ease-out infinite; }
    .v7-11-heart { transform-origin: 590.7px 69.4px; animation: v7_11_heart 2.4s ease-out infinite; }
  </style>
  <clipPath id="v7_11_clip"><rect width="640" height="120"/></clipPath>
  <g clip-path="url(#v7_11_clip)">
    <image href="data:image/webp;base64," x="0" y="0" width="640" height="120"/>
    <!-- Orange Tabby Cat Paw Facing Viewer (Pink Toe Beans Clearly Visible!) -->
    <image class="v7-11-orange" href="data:image/webp;base64," x="0" y="0" width="640" height="132"/>
    <!-- Grey Tabby Cat Paw Facing AWAY (Fluffy Striped Back of Paw) Slapping Palm-to-Palm! -->
    <image class="v7-11-grey" href="data:image/webp;base64," x="0" y="0" width="640" height="132"/>
    <!-- Comic Impact Starburst on Palm-to-Palm High-Five -->
    <g class="v7-11-burst" stroke="#fde047" stroke-width="2.3" stroke-linecap="round">
      <line x1="590.7" y1="59.4" x2="590.7" y2="50.4"/>
      <line x1="578.7" y1="63.4" x2="570.7" y2="56.4"/>
      <line x1="602.7" y1="63.4" x2="610.7" y2="56.4"/>
      <line x1="574.7" y1="73.4" x2="566.7" y2="73.4"/>
      <line x1="606.7" y1="73.4" x2="614.7" y2="73.4"/>
    </g>
    <!-- Cute Popping Pink Heart -->
    <g class="v7-11-heart">
      <g transform="translate(590.7,61.4)">
        <path d="M0,3.5 C0,0 -5.5,-1.2 -5.5,2.8 C-5.5,6.5 0,10 0,10 C0,10 5.5,6.5 5.5,2.8 C5.5,-1.2 0,0 0,3.5 Z" fill="#f9a8d4" stroke="#4c0519" stroke-width="1.1"/>
      </g>
    </g>
  </g>
</svg>