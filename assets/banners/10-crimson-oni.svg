<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120">
  
  <style class="np-anim">@keyframes a10_oni { 0%,100% { transform: translate(566px,70px) rotate(-10deg) scale(1.18); } 50% { transform: translate(566px,62px) rotate(-6deg) scale(1.25); } }
        @keyframes a10_emb { 0% { transform: translate(0px, 24px); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(-34px, -74px); opacity: 0; } }
        g[transform*="translate(566,70)"] { animation: a10_oni 2.4s ease-in-out infinite; }
        .a10-e1 { animation: a10_emb 2.0s linear infinite; }
        .a10-e2 { animation: a10_emb 2.5s linear infinite -1.1s; }</style>
  <defs>

    <linearGradient id="bg10" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14080b"/>
      <stop offset="48%" stop-color="#290b12"/>
      <stop offset="86%" stop-color="#4d0d18"/>
      <stop offset="100%" stop-color="#170508"/>
    </linearGradient>
    <linearGradient id="hannyaRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f02e44"/>
      <stop offset="45%" stop-color="#a60f23"/>
      <stop offset="100%" stop-color="#2e040a"/>
    </linearGradient>
    <linearGradient id="horn10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff9eb"/>
      <stop offset="55%" stop-color="#d4c0a1"/>
      <stop offset="100%" stop-color="#5c4b38"/>
    </linearGradient>
    <filter id="glow10" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>
  <clipPath id="npClip"><rect width="640" height="120"/></clipPath>
  <g clip-path="url(#npClip)">

    <rect width="640" height="120" fill="url(#bg10)"/>
    <!-- Sweeping Dark Sumi-e Smoke Waves Behind Mask -->
    <path d="M 396 120 C 424 72, 466 44, 522 36 C 488 64, 480 94, 496 120 Z" fill="#0a0305" opacity="0.78"/>
    <path d="M 432 120 C 454 88, 488 70, 526 64 C 504 86, 500 104, 510 120 Z" fill="#6b0d1b" opacity="0.45"/>

    <!-- Dramatic Tilted & Tightly-Cropped Hannya Demon Mask (Zero Cute Emoji Symmetry!) -->
    <g transform="translate(566,70) rotate(-10) scale(1.18)" stroke="#090305" stroke-width="2.8" stroke-linejoin="round">
      <!-- Swept Striated Ivory Demon Horns -->
      <path d="M -22 -28 C -42 -48, -36 -74, -14 -76 C -22 -56, -14 -42, -6 -32 Z" fill="url(#horn10)"/>
      <path d="M 22 -28 C 44 -48, 38 -74, 16 -76 C 24 -56, 16 -42, 8 -32 Z" fill="url(#horn10)"/>
      <!-- Horn striation ridges -->
      <path d="M -30 -52 L -20 -48 M -28 -62 L -18 -58 M 30 -52 L 20 -48 M 28 -62 L 18 -58" stroke="#4a3c2c" stroke-width="1.6"/>

      <!-- Sculpted Gaunt Hannya Cheekbones & Jaw -->
      <path d="M -38 -24 C -36 -42, 36 -42, 38 -24 C 46 -6, 44 14, 34 26 L 26 52 L -26 52 L -34 26 C -44 14, -46 -6, -38 -24 Z" fill="url(#hannyaRed)"/>

      <!-- Heavy Chiaroscuro Black Ink Half-Shadow Across Right Side of Mask -->
      <path d="M 6 -38 C 24 -36, 36 -30, 38 -24 C 46 -6, 44 14, 34 26 L 26 52 L 4 52 L 8 24 L 22 14 L 26 -6 L 12 -18 Z"
            fill="#140407" opacity="0.72" stroke="none"/>

      <!-- Sharp Furrowed Demon Brow & Cheek Scar Lines -->
      <path d="M -36 -18 L -8 -2 L 0 -12 L 8 -2 L 36 -18" fill="none" stroke="#090305" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M -32 8 C -20 14, -14 22, -16 32 M 32 8 C 20 14, 14 22, 16 32" fill="none" stroke="#090305" stroke-width="2.5"/>

      <!-- Piercing Glowing Gold Slit Demon Eyes -->
      <g filter="url(#glow10)">
        <path d="M -32 -8 L -8 2 L -24 10 Z" fill="#ffd24d" stroke="#090305" stroke-width="2"/>
        <path d="M 32 -8 L 8 2 L 24 10 Z" fill="#ffd24d" stroke="#090305" stroke-width="2"/>
      </g>

      <!-- Snarling Split-Ear-to-Ear Demon Maw with Curved Tusks -->
      <path d="M -32 22 C -14 14, 14 14, 32 22 C 26 42, -26 42, -32 22 Z" fill="#080204"/>
      <path d="M -24 36 L -30 12 L -14 28 Z" fill="url(#horn10)" stroke-width="2.2"/>
      <path d="M 24 36 L 30 12 L 14 28 Z" fill="url(#horn10)" stroke-width="2.2"/>
      <!-- Sharp Fangs -->
      <path d="M -14 20 L -10 31 L -6 19 L -2 32 L 2 19 L 6 32 L 10 19 L 14 31 L 14 18 L -14 18 Z" fill="#fff4e0" stroke="none"/>
    </g>
    <circle cx="510.9" cy="60.3" r="1.5" fill="#ffd257" opacity="0.60"/><circle cx="546.0" cy="43.9" r="1.9" fill="#ffd257" opacity="0.62"/><circle cx="538.9" cy="90.7" r="1.0" fill="#ff4d5a" opacity="0.68"/><circle cx="466.9" cy="25.9" r="1.8" fill="#fff5cc" opacity="0.87"/><circle cx="394.4" cy="22.2" r="2.3" fill="#ff4d5a" opacity="0.58"/><circle cx="572.7" cy="47.1" r="1.2" fill="#ffd257" opacity="0.87"/><circle cx="458.1" cy="72.4" r="2.1" fill="#fff5cc" opacity="0.85"/><circle cx="591.1" cy="40.2" r="2.3" fill="#fff5cc" opacity="0.70"/><circle cx="471.0" cy="96.7" r="1.5" fill="#fff5cc" opacity="0.50"/><circle cx="372.9" cy="101.5" r="2.1" fill="#fff5cc" opacity="0.86"/><circle cx="544.1" cy="75.0" r="2.4" fill="#ffd257" opacity="0.57"/><circle cx="427.3" cy="13.8" r="1.5" fill="#ffd257" opacity="0.53"/><circle cx="512.1" cy="57.9" r="1.6" fill="#fff5cc" opacity="0.82"/><circle cx="578.1" cy="23.5" r="2.0" fill="#ff4d5a" opacity="0.81"/><circle cx="585.2" cy="100.7" r="1.5" fill="#fff5cc" opacity="0.51"/><circle cx="482.5" cy="87.3" r="2.0" fill="#fff5cc" opacity="0.86"/><circle cx="540.0" cy="90.1" r="1.3" fill="#ff4d5a" opacity="0.48"/><circle cx="629.7" cy="103.5" r="1.0" fill="#ff4d5a" opacity="0.81"/><circle cx="468.8" cy="35.0" r="2.1" fill="#ff4d5a" opacity="0.59"/><circle cx="486.5" cy="73.8" r="1.8" fill="#fff5cc" opacity="0.84"/><circle cx="593.8" cy="28.2" r="1.5" fill="#ffd257" opacity="0.69"/><circle cx="562.4" cy="78.5" r="2.1" fill="#fff5cc" opacity="0.49"/><circle cx="444.3" cy="63.4" r="1.5" fill="#fff5cc" opacity="0.66"/><circle cx="607.3" cy="25.7" r="1.7" fill="#ff4d5a" opacity="0.61"/><circle cx="490.1" cy="71.3" r="1.8" fill="#ff4d5a" opacity="0.56"/><circle cx="478.4" cy="44.1" r="1.2" fill="#fff5cc" opacity="0.87"/><circle cx="542.9" cy="37.4" r="1.0" fill="#ffd257" opacity="0.48"/><circle cx="571.3" cy="52.2" r="2.3" fill="#ff4d5a" opacity="0.78"/><circle cx="496.5" cy="65.7" r="1.9" fill="#ffd257" opacity="0.72"/><circle cx="555.9" cy="77.8" r="1.9" fill="#ff4d5a" opacity="0.82"/><circle cx="530.2" cy="38.5" r="1.3" fill="#fff5cc" opacity="0.74"/><circle cx="441.4" cy="76.2" r="1.2" fill="#ff4d5a" opacity="0.46"/>

    <!-- NP_FX_START -->
<g class="np-fx">
          <g class="a10-e1"><circle cx="468" cy="112" r="3.2" fill="#ffd24d"/><circle cx="534" cy="116" r="2.8" fill="#ff4d5a"/><circle cx="614" cy="110" r="3" fill="#fff3b8"/></g>
          <g class="a10-e2"><circle cx="498" cy="114" r="3" fill="#ff6b57"/><circle cx="584" cy="116" r="3.4" fill="#ffe066"/></g>
        </g>
    <!-- NP_FX_END -->
  </g>
</svg>
