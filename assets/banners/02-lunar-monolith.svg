<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120">
  
  <style class="np-anim">@keyframes a02_beam { 0%,100% { transform: translateX(-18px); opacity: 0.08; } 50% { transform: translateX(24px); opacity: 0.24; } }
        @keyframes a02_fog { 0%,100% { transform: translateX(-22px); opacity: 0.16; } 50% { transform: translateX(22px); opacity: 0.36; } }
        @keyframes a02_star { 0%,100% { opacity: 0.2; transform: scale(0.6); } 50% { opacity: 1; transform: scale(1.4); } }
        .a02-beam { animation: a02_beam 3.6s ease-in-out infinite; }
        .a02-fog { animation: a02_fog 4.2s ease-in-out infinite; }
        .a02-s1 { transform-box: fill-box; transform-origin: center; animation: a02_star 1.8s ease-in-out infinite; }
        .a02-s2 { transform-box: fill-box; transform-origin: center; animation: a02_star 2.3s ease-in-out infinite -0.8s; }</style>
  <defs>

    <linearGradient id="bg02" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#101319"/>
      <stop offset="48%" stop-color="#19212e"/>
      <stop offset="86%" stop-color="#2e3e54"/>
      <stop offset="100%" stop-color="#151c26"/>
    </linearGradient>
    <radialGradient id="moon02" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#c4dbf0"/>
      <stop offset="85%" stop-color="#5e7996"/>
      <stop offset="100%" stop-color="#223042"/>
    </radialGradient>
    <radialGradient id="halo02" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b5dcff" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#19212e" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur02" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="mc02"><circle cx="556" cy="56" r="56"/></clipPath>
    
  </defs>
  <clipPath id="npClip"><rect width="640" height="120"/></clipPath>
