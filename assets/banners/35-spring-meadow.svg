<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120">
  <style class="np-anim">
    @keyframes v5_13_pt { 0%{transform:translate(16px,-10px) rotate(0deg);opacity:0} 15%{opacity:0.95} 85%{opacity:0.8} 100%{transform:translate(-95px,28px) rotate(-55deg);opacity:0} }
    @keyframes v5_13_cam { 0%,100%{transform:scale(1.01)} 50%{transform:scale(1.035) translateX(-3px)} }
    .v5_13-bg { transform-origin: 540px 90px; animation: v5_13_cam 5.5s ease-in-out infinite; }
    .v5_13-p1 { animation: v5_13_pt 3.4s ease-in-out infinite; }
    .v5_13-p2 { animation: v5_13_pt 4.2s ease-in-out 1.2s infinite; }
    .v5_13-p3 { animation: v5_13_pt 3.8s ease-in-out 2.3s infinite; }
  </style>
  <clipPath id="v5_13_clip"><rect width="640" height="120"/></clipPath>
  <g clip-path="url(#v5_13_clip)">
    <image class="v5_13-bg" href="data:image/webp;base64," x="0" y="0" width="640" height="120"/>
    <ellipse class="v5_13-p1" cx="595" cy="48" rx="4.2" ry="2.1" fill="#fbcfe8"/>
    <ellipse class="v5_13-p2" cx="555" cy="66" rx="3.6" ry="1.8" fill="#f9a8d4"/>
    <ellipse class="v5_13-p3" cx="618" cy="74" rx="3.8" ry="1.9" fill="#fce7f3"/>
  </g>
</svg>