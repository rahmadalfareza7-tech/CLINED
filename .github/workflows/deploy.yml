name: Deploy CLINED

on:
  push:
    branches:
      - main

concurrency:
  group: clined-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          rsync -az --delete-delay \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6" \
            ./ "$VPS_USER@$VPS_HOST:/root/CLINED/"

          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "$VPS_USER@$VPS_HOST" <<'EOF2'
          set -e
          cd /root/CLINED

          if [ -f package-lock.json ]; then
            npm ci --omit=dev
          fi

          pm2 restart clined-api --update-env
          pm2 save

          echo "CLINED deployment successful"
          EOF2
