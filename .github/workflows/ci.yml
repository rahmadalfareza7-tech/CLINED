name: CI Quality & Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: clined-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Syntax, CSP, CSS, Banks & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate (syntax, CSS, strict CSP, SW parity)
        run: npm run check:all

      - name: Validate question banks
        run: npm run validate:banks

      - name: Run unit & integration tests
        run: npm test
